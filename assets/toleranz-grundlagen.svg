<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Grundbegriffe einer Toleranzkurve</title>
<desc id="desc">Schematische Lebensleistung zwischen Minimum und Maximum. Die Pessima liegen an beiden Rändern. Das Präferendum umfasst den Bereich um das Optimum. Der Fortpflanzungsbereich liegt innerhalb des Überlebensbereichs. Keine realen Messwerte.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#315954" stroke-width="1.5"/></marker></defs>
<rect width="900" height="540" rx="14" fill="#fcfdf9"/>
<g font-family="Arial,sans-serif" fill="#173f40" font-size="18">
<text x="90" y="30">Untersuchte Lebensleistung</text>
<rect x="170" y="75" width="80" height="255" fill="#f3c9c3"/>
<rect x="250" y="75" width="120" height="255" fill="#f3dfad"/>
<rect x="370" y="75" width="160" height="255" fill="#c3dfc8"/>
<rect x="530" y="75" width="120" height="255" fill="#f3dfad"/>
<rect x="650" y="75" width="80" height="255" fill="#f3c9c3"/>
<path d="M90 55V330H825" fill="none" stroke="#315954" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M170 330C210 325 225 300 250 260S355 90 450 90S625 220 650 260S690 325 730 330" fill="none" stroke="#087c88" stroke-width="4"/>
<circle cx="450" cy="90" r="5" fill="#087c88"/>
<path d="M450 61V81" stroke="#315954" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="54" text-anchor="middle" font-weight="bold">Optimum</text>
<text x="450" y="224" text-anchor="middle" font-weight="bold">Präferendum</text>
<path d="M375 237H525" stroke="#315954" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="210" y="185" text-anchor="middle" transform="rotate(-90 210 185)">Pessimum</text>
<text x="690" y="185" text-anchor="middle" transform="rotate(90 690 185)">Pessimum</text>
<path d="M170 323V340M730 323V340" stroke="#315954" stroke-width="2"/>
<text x="170" y="365" text-anchor="middle" font-weight="bold">Minimum</text>
<text x="730" y="365" text-anchor="middle" font-weight="bold">Maximum</text>
<text x="450" y="397" text-anchor="middle">Stärke des Umweltfaktors: niedrig → hoch</text>
<path d="M250 414V432H650V414" fill="none" stroke="#b08a39" stroke-width="2"/>
<text x="450" y="457" text-anchor="middle">Fortpflanzungsbereich</text>
<path d="M170 470V489H730V470" fill="none" stroke="#315954" stroke-width="2"/>
<text x="450" y="516" text-anchor="middle" font-weight="bold">Toleranzbereich · Überleben möglich</text>
</g></svg>
